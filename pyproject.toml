[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "eicsmooth"
version = "1.0"
description = "Compare MS-DIAL and MZmine EIC smoothing and quantify raw-relative peak morphology"
authors = [
  { name = "Gun Woo Lee", email = "dlrjsdn0526@konkuk.ac.kr" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "LGPL-3.0-only"
license-files = ["LICENSE*", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["metabolomics", "mass-spectrometry", "EIC", "smoothing", "MS-DIAL", "MZmine"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy==1.26.4",
  "matplotlib==3.9.3",
  "pyteomics[xml]==5.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
eicsmooth = "eic_smoothing_simulator:main"

[tool.setuptools]
py-modules = ["eic_smoothing_simulator"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
